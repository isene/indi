[package]
name = "indi"
version = "0.2.1"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Telescope gear through an INDI server, in the terminal: a focuser, a mount and every property their drivers have"
license = "Unlicense"
repository = "https://github.com/isene/indi"

[dependencies]
crust = { version = "0.1.80", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1.53", path = "../glow", package = "fe2o3-glow" }
orbit = { version = "0.2.0", path = "../orbit", package = "fe2o3-orbit" }
starmap = { version = "0.1.13", path = "../starmap", package = "fe2o3-starmap" }

[profile.release]
opt-level = 3
lto = true
strip = true
