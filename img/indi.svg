<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <linearGradient id="tube" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eef1f7"/>
      <stop offset="100%" style="stop-color:#8d96a8"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- The sky -->
  <g fill="#dfe7ff">
    <circle cx="62" cy="64" r="1.6"/>
    <circle cx="96" cy="44" r="1.2"/>
    <circle cx="150" cy="40" r="1.8"/>
    <circle cx="178" cy="112" r="1.3"/>
    <circle cx="44" cy="110" r="1.2"/>
    <circle cx="214" cy="128" r="1.5"/>
    <circle cx="120" cy="70" r="1"/>
    <circle cx="232" cy="96" r="1"/>
  </g>

  <!-- The target, in the cross hairs -->
  <circle cx="200" cy="64" r="4.5" fill="#fff6c8"/>
  <g stroke="url(#rust)" stroke-width="2" fill="none">
    <circle cx="200" cy="64" r="11"/>
    <path d="M 200 47 L 200 55 M 200 73 L 200 81 M 183 64 L 191 64 M 209 64 L 217 64"/>
  </g>

  <!-- The mount: a tripod and a head -->
  <g stroke="#6b7385" stroke-width="5" stroke-linecap="round">
    <path d="M 122 150 L 92 190"/>
    <path d="M 122 150 L 122 194"/>
    <path d="M 122 150 L 152 190"/>
  </g>
  <rect x="110" y="132" width="24" height="20" rx="3" fill="#4a5163"/>

  <!-- The telescope, pointed at the target: camera, focuser, tube, dew shield -->
  <g transform="rotate(-37 122 124)">
    <rect x="34" y="112" width="16" height="24" rx="2" fill="#2b2f3a" stroke="url(#rust)" stroke-width="2"/>
    <rect x="50" y="117" width="14" height="14" fill="#6b7385"/>
    <rect x="64" y="111" width="104" height="26" rx="2" fill="url(#tube)"/>
    <rect x="166" y="107" width="26" height="34" rx="2" fill="#2b2f3a"/>
    <rect x="166" y="107" width="4" height="34" fill="url(#rust)"/>
  </g>

  <text x="128" y="218" font-family="monospace" font-size="24" font-weight="bold"
        fill="url(#rust)" text-anchor="middle" letter-spacing="3">indi</text>
  <text x="128" y="234" font-family="monospace" font-size="8" fill="#888"
        text-anchor="middle">telescope gear</text>
</svg>
